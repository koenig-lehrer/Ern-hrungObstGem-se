const questions=[];function Q(id,q,a,c,h,e){questions.push({id,q,a,c,h,e})}
Q('amount',L('Wie viele Portionen Obst und Gemüse sind pro Tag eine gute Orientierung?','Скільки порцій овочів і фруктів на день є добрим орієнтиром?'),[L('Mindestens 5 Portionen insgesamt.','Щонайменше 5 порцій разом.'),L('Nur 1 Portion pro Woche.','Лише 1 порція на тиждень.'),L('5 Portionen Obst und 5 Portionen Gemüse.','5 порцій фруктів і 5 порцій овочів.')],0,L('Obst und Gemüse werden zusammengezählt.','Фрукти й овочі рахують разом.'),L('Die DGE empfiehlt mindestens 5 Portionen Obst und Gemüse am Tag. Verteile sie auf deine Mahlzeiten.','DGE рекомендує щонайменше 5 порцій овочів і фруктів на день. Розподіли їх між прийомами їжі.'));
Q('hand',L('Wie schätzt du deine Portion ab?','Як приблизно визначити свою порцію?'),[L('Mit der Hand eines Erwachsenen.','За рукою дорослої людини.'),L('Mit meiner eigenen Hand.','За своєю рукою.'),L('Jede Portion muss genau gleich schwer sein.','Усі порції мають важити однаково.')],1,L('Dein Maß wächst mit dir mit.','Твоя міра росте разом із тобою.'),L('Die eigene Hand hilft: Ein großer Apfel passt in eine Hand. Kleine Früchte oder geschnittenes Gemüse passen in zwei zur Schale geformte Hände.','Власна рука допомагає: велике яблуко поміщається в одній руці. Дрібні фрукти або нарізані овочі — у двох долонях, складених човником.'));
Q('contents',L('Was steckt in Obst und Gemüse?','Що містять овочі та фрукти?'),[L('Nur Wasser und Zucker.','Лише воду та цукор.'),L('In jeder Sorte nur ein einziger Nährstoff.','У кожному виді лише одну поживну речовину.'),L('Ballaststoffe, Vitamine und Mineralstoffe.','Клітковину, вітаміни та мінеральні речовини.')],2,L('Ein Lebensmittel bringt mehrere verschiedene Stoffe mit.','Один продукт містить кілька різних речовин.'),L('Obst und Gemüse liefern mehrere wichtige Stoffe. Jede Sorte hat eine andere Zusammensetzung.','Овочі та фрукти дають кілька важливих речовин. Кожен вид має інший склад.'));
Q('fiber',L('Wobei helfen Ballaststoffe?','У чому допомагає клітковина?'),[L('Sie unterstützen die Verdauung.','Вона підтримує травлення.'),L('Sie ersetzen das Trinken.','Вона замінює пиття.'),L('Sie machen das Hören besser.','Вона покращує слух.')],0,L('Denke an den Darm.','Подумай про кишківник.'),L('Ballaststoffe unterstützen die Verdauung. Manche binden Wasser, andere dienen nützlichen Darmbakterien als Nahrung. Genug zu trinken gehört dazu.','Клітковина підтримує травлення. Деякі її види зв’язують воду, інші є їжею для корисних кишкових бактерій. Важливо також достатньо пити.'));
Q('vitamin',L('Wobei hilft Vitamin C deinem Körper?','У чому вітамін C допомагає тілу?'),[L('Es ersetzt den Schlaf.','Замінює сон.'),L('Es hilft der Körperabwehr.','Допомагає захисним силам організму.'),L('Es verhindert jede Krankheit.','Запобігає всім хворобам.')],1,L('Deine Abwehr hilft dir gegen Krankheitserreger.','Захисні сили допомагають боротися зі збудниками хвороб.'),L('Vitamin C hilft deiner Körperabwehr, richtig zu arbeiten. Trotzdem kannst du auch bei guter Ernährung krank werden.','Вітамін C допомагає захисним силам працювати правильно. Але навіть за доброго харчування можна захворіти.'));
Q('mineral',L('Wofür ist der Mineralstoff Kalium wichtig?','Для чого важливий мінерал калій?'),[L('Damit du nie wieder essen musst.','Щоб більше ніколи не їсти.'),L('Damit deine Haare schneller wachsen.','Щоб волосся швидше росло.'),L('Damit Muskeln und Nerven arbeiten können.','Щоб працювали м’язи та нерви.')],2,L('Denke an Bewegung und Signale im Körper.','Подумай про рух і сигнали в тілі.'),L('Kalium hilft bei der Weiterleitung von Nervensignalen und bei der Arbeit deiner Muskeln. Ein einzelner Apfel macht keine starken Muskeln.','Калій допомагає передавати нервові сигнали та працювати м’язам. Від одного яблука м’язи не стають сильними.'));
Q('lackfiber',L('Was kann bei dauerhaft zu wenig Ballaststoffen passieren?','Що може статися, якщо тривалий час їсти замало клітковини?'),[L('Verstopfung: Der Toilettengang fällt schwer.','Закреп: важко сходити в туалет.'),L('Die Zähne wachsen schneller.','Зуби ростуть швидше.'),L('Die Muskeln werden automatisch stärker.','М’язи автоматично стають сильнішими.')],0,L('Ballaststoffe helfen deinem Darm.','Клітковина допомагає кишківнику.'),L('Zu wenig Ballaststoffe können Verstopfung begünstigen. Der Stuhl kann hart werden. Verstopfung kann auch andere Ursachen haben.','Замало клітковини може сприяти закрепу. Кал може стати твердим. Закреп може мати й інші причини.'));
Q('lack',L('Was kann passieren, wenn wichtige Nährstoffe lange fehlen?','Що може статися, якщо важливих поживних речовин довго бракує?'),[L('Ein Tag ohne Obst macht sofort krank.','Один день без фруктів одразу спричиняє хворобу.'),L('Abwehr, Muskeln und Nerven können schlechter arbeiten.','Захисні сили, м’язи та нерви можуть працювати гірше.'),L('Der Körper braucht dann weniger Nährstoffe.','Тоді тілу потрібно менше поживних речовин.')],1,L('Es geht um einen Mangel über längere Zeit.','Йдеться про нестачу протягом тривалого часу.'),L('Ein Mangel an wichtigen Nährstoffen kann die Abwehr, Muskeln und Nerven schwächen. Wenig Obst allein bedeutet nicht automatisch einen Mangel. Auch andere Lebensmittel liefern wichtige Stoffe.','Нестача важливих поживних речовин може послабити захисні сили, м’язи та нерви. Мало фруктів не означає автоматично нестачу. Інші продукти теж містять важливі речовини.'));
Q('variety',L('Welche Auswahl bringt mehr Abwechslung?','Який вибір різноманітніший?'),[L('Jeden Tag nur Äpfel.','Щодня лише яблука.'),L('Nur Obst, das immer gleich aussieht.','Лише фрукти однакового вигляду.'),L('Verschiedene Obst- und Gemüsesorten.','Різні види овочів і фруктів.')],2,L('Jede Sorte hat eine andere Zusammensetzung.','Кожен вид має інший склад.'),L('Verschiedene Sorten liefern unterschiedliche wichtige Stoffe. Rohes und gegartes Gemüse können beide dazugehören.','Різні види дають різні важливі речовини. Підходять і сирі, і приготовані овочі.'));
Q('juice',L('Was liefert meist mehr Ballaststoffe und sättigt besser?','Що зазвичай містить більше клітковини та краще насичує?'),[L('Ein ganzer Apfel.','Ціле яблуко.'),L('Ein Glas klarer Apfelsaft.','Склянка прозорого яблучного соку.'),L('Beides ist immer genau gleich.','Обидва завжди цілком однакові.')],0,L('Beim Saft fehlen viele feste Teile des Apfels.','У соку немає багатьох твердих частин яблука.'),L('Ganzes Obst liefert meist mehr Ballaststoffe und sättigt besser als Saft. Saft ist kein gleichwertiger Ersatz für alle Obstportionen.','Цілі фрукти зазвичай містять більше клітковини та краще насичують, ніж сік. Сік не є рівноцінною заміною всіх порцій фруктів.'));
const memories=[
['amount',L('Die Menge','Кількість'),L('Ich esse jeden Tag mindestens fünf Portionen Obst und Gemüse.','Я їм щодня щонайменше п’ять порцій овочів і фруктів.')],
['hand',L('Meine Portion','Моя порція'),L('Meine eigene Hand hilft mir, eine Portion abzuschätzen.','Моя рука допомагає приблизно визначити порцію.')],

['mineral',L('Mineralstoffe','Мінеральні речовини'),L('Kalium ist wichtig für meine Muskeln und Nerven.','Калій важливий для моїх м’язів і нервів.')],
['variety',L('Abwechslung','Різноманітність'),L('Verschiedene Sorten liefern verschiedene wichtige Inhaltsstoffe.','Різні види дають різні важливі речовини.')],

const KEY='obst-gemuese-lernen-v1';const fresh=()=>({lang:'de',answers:{},favorites:[],plan:[],explored:[],food:'apple',fed:[],body:'fiber',mode:'good',seen:[],simulated:false});let state=fresh();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&['de','uk'].includes(s.lang)&&s.answers){state={...state,...s};for(const k of ['favorites','plan','explored','fed','seen'])if(!Array.isArray(state[k]))state[k]=[];if(!foods.some(f=>f.id===state.food))state.food='apple';if(!['fiber','vitamin','mineral'].includes(state.body))state.body='fiber';if(!['good','lack'].includes(state.mode))state.mode='good'}}catch{}let timer=null,toastTimer=null;const t=x=>typeof x==='string'?x:x[state.lang];const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function toast(msg){const n=document.querySelector('#toast');n.textContent=msg;n.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.add('hide'),4000)}function speak(s){if(!('speechSynthesis'in window)){toast('Vorlesen ist auf diesem Gerät nicht verfügbar.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='de-DE';u.rate=.87;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('de'));if(v)u.voice=v;u.onerror=()=>toast('Vorlesen ist gerade nicht verfügbar. Alle Texte bleiben lesbar.');speechSynthesis.speak(u)}function audio(s){return state.lang==='de'?`<button class="listen" data-say="${E(s)}">▶ Vorlesen</button>`:''}function done(id){return !!state.answers[id]?.done}function quiz(id){const q=questions.find(q=>q.id===id),a=state.answers[id]||{};return`<article class="quiz" id="q-${id}"><div class="head"><h3>${a.done?'✓ ':''}${t(q.q)}</h3>${audio(t(q.q)+' '+q.a.map(t).join('. '))}</div><div class="answers">${q.a.map((x,i)=>`<button class="answer ${a.done&&i===q.c?'correct':''} ${!a.done&&a.choice===i?'wrong':''}" data-q="${id}" data-answer="${i}" ${a.done?'disabled':''}><span class="letter">${'ABC'[i]}</span>${t(x)}</button>`).join('')}</div>${a.done?`<div class="feedback" role="status"><strong>${t(a.correct?L('Richtig!','Правильно!'):L('Die Erklärung','Пояснення'))}</strong><br>${t(q.e)} ${audio(t(q.e))}</div>`:a.tries?`<div class="feedback hint" role="status">${t(q.h)} ${t(L('Probiere es noch einmal.','Спробуй ще раз.'))}${audio(t(q.h))}${a.tries>=2?`<p><button data-solution="${id}">${t(L('Erklärung zeigen','Показати пояснення'))}</button></p>`:''}</div>`:''}</article>`}
function next(n){return`<div class="next"><a href="#s${n}">${t(L('Weiter','Далі'))}</a></div>`}function head(n,title,sub){return`<div class="eyebrow">${t(L('Station','Станція'))} 0${n}</div><div class="head"><h2>${t(title)}</h2>${audio(t(title)+'. '+t(sub))}</div><p>${t(sub)}</p>`}function foodButtons(action){return`<div class="grid">${foods.map(f=>`<button class="food" data-${action}="${f.id}" ${action==='favorite'?`aria-pressed="${state.favorites.includes(f.id)}"`:''}><span class="icon" aria-hidden="true">${f.icon}</span>${t(f.name)}${action==='plan'?`<span class="small">${t(f.portion)}</span>`:''}${action==='favorite'&&state.favorites.includes(f.id)?' ✓':''}</button>`).join('')}</div>`}
const bodyNames={fiber:L('Verdauung','Травлення'),vitamin:L('Körperabwehr','Захисні сили'),mineral:L('Muskeln und Nerven','М’язи та нерви')};
const info={fiber:L('Ballaststoffe gelangen bis in den Dickdarm. Manche binden Wasser und können den Stuhl weicher machen. Andere dienen nützlichen Darmbakterien als Nahrung.','Клітковина доходить до товстої кишки. Деякі її види зв’язують воду й можуть пом’якшувати кал. Інші є їжею для корисних кишкових бактерій.'),vitamin:L('Vitamin C hilft der Körperabwehr. Deine Abwehr bekämpft Krankheitserreger. Sie ist aber kein perfekter Schutzschild.','Вітамін C допомагає захисним силам організму. Вони борються зі збудниками хвороб, але не є ідеальним щитом.'),mineral:L('Kalium ist ein Mineralstoff. Es hilft, Nervensignale weiterzuleiten. Deine Muskeln brauchen diese Signale, um sich zu bewegen.','Калій — мінеральна речовина. Він допомагає передавати нервові сигнали. М’язам потрібні ці сигнали для руху.')};
const consequence={fiber:L('Auf Dauer zu wenig Ballaststoffe können Verstopfung begünstigen. Dann fällt der Toilettengang schwer.','Тривала нестача клітковини може сприяти закрепу. Тоді важко сходити в туалет.'),vitamin:L('Fehlt Vitamin C längere Zeit, kann die Abwehr schlechter arbeiten. Du kannst anfälliger für Krankheiten werden.','Якщо вітаміну C довго бракує, захисні сили можуть працювати гірше. Ти можеш легше захворіти.'),mineral:L('Bei einem Mangel an wichtigen Mineralstoffen können Muskeln und Nerven schlechter arbeiten.','За нестачі важливих мінеральних речовин м’язи та нерви можуть працювати гірше.')};
function animation(){const good=state.mode==='good',b=state.body;if(b==='fiber')return`<svg class="gut" viewBox="0 0 240 130" role="img" aria-label="${t(L('Vereinfachter Weg durch den Darm','Спрощений шлях через кишківник'))}"><path id="gutpath" d="M25 15H195Q222 15 222 40T195 65H45Q18 65 18 90T45 115H200" stroke="#bd9f82" stroke-width="22" fill="none" stroke-linecap="round"/><circle r="${good?9:12}" fill="${good?'#378862':'#805c45'}"><animateMotion dur="${good?'3':'10'}s" repeatCount="indefinite" path="${good?'M25 15H195Q222 15 222 40T195 65H45Q18 65 18 90T45 115H200':'M25 15H100'}"/></circle></svg><div class="result-icon" aria-hidden="true">${good?'🙂 🚽':'😣 🚽'}</div><p>${t(good?L('Der Stuhl kann leichter weitertransportiert werden.','Кал може легше рухатися далі.'):L('Der Stuhl kann hart sein. Der Toilettengang dauert länger.','Кал може бути твердим. Сходити в туалет важче.'))}</p>`;

return`<div class="result-icon ${good?'lift':'weak'}" aria-hidden="true">${good?'🧍 🎒':'🧎 🎒'}</div><p>${t(good?L('Muskeln und Nerven arbeiten zusammen. Die Figur hebt ihren Rucksack.','М’язи та нерви працюють разом. Людина піднімає рюкзак.'):L('Bei einem Mangel können Bewegungen schwerer fallen.','За нестачі рухатися може бути важче.'))}</p>`}
function game(){return`<div class="split"><div><h3>${t(L('Füttere die Figur','Нагодуй персонажа'))}</h3><p>${t(L('Tippe auf eine Sorte. Entdecke bis zu fünf verschiedene Sorten.','Натисни на продукт. Досліди до п’яти різних видів.'))}</p>${foodButtons('feed')}</div><div><div class="scene" id="person"><span class="person" aria-hidden="true">🧍</span><strong>${t(L('Hallo, ich bin Alex!','Привіт, я Алекс!'))}</strong><span class="caption">${t(L('Was gibst du mir heute?','Що ти даси мені сьогодні?'))}</span></div><div class="panel"><div class="row">${state.fed.map(id=>{const f=foods.find(f=>f.id===id);return`<span class="pill">${f.icon} ${t(f.name)}</span>`}).join('')||t(L('Noch nichts ausgewählt.','Ще нічого не обрано.'))}</div><p class="small">${t(L('Das ist eine Entdeckerauswahl, kein vollständiger Speiseplan und kein Nährstoff-Test.','Це вибір для дослідження, а не повний раціон чи перевірка поживних речовин.'))}</p><button class="primary" id="simulate">${t(L('Was passiert auf Dauer?','Що відбувається з часом?'))}</button><button id="clearfeed">${t(L('Auswahl leeren','Очистити вибір'))}</button><div class="calendar" id="calendar" role="status"></div></div></div></div><div class="panel"><div class="tabs">${Object.entries(bodyNames).map(([k,v])=>`<button data-body="${k}" aria-pressed="${state.body===k}">${t(v)}</button>`).join('')}</div><p>${t(info[state.body])} ${audio(t(info[state.body]))}</p><div class="row"><span class="tag">${t(L('Vereinfachtes Modell','Спрощена модель'))}</span></div><div class="tabs" style="margin-top:15px"><button data-mode="good" aria-pressed="${state.mode==='good'}">${t(L('Gut versorgt','Добре забезпечений організм'))}</button><button data-mode="lack" aria-pressed="${state.mode==='lack'}">${t(L('Auf Dauer fehlt etwas','Тривалий час чогось бракує'))}</button></div><div class="outcome" id="outcome" aria-live="polite">${state.simulated?animation():t(L('Füttere Alex und starte den Zeitvergleich.','Нагодуй Алекса й запусти порівняння в часі.'))}</ <section id="s2">${head(2,L('Was magst du?','Що ти любиш?'),L('Wähle deine Lieblingssorten. Hier gibt es kein Richtig oder Falsch.','Обери улюблені види. Тут немає правильних чи неправильних відповідей.'))}${foodButtons('favorite')}<div class="panel"><h3>${t(L('Fünf Portionen für deinen Tag','П’ять порцій на твій день'))}</h3><p>${t(L('Tippe unten auf eine Portion. Sie kommt in das nächste freie Feld. Verschiedene Sorten bringen Abwechslung.','Натисни нижче на порцію. Вона займе наступне вільне поле. Різні види дають різноманітність.'))}</p><div class="slots">${Array.from({length:5},(_,i)=>{const f=foods.find(f=>f.id===state.plan[i]);return`<div class="slot"><small>${t(L('Portion','Порція'))} ${i+1}</small>${f?`<span>${f.icon}</span><small>${t(f.name)}</small><button data-remove="${i}" aria-label="${t(L('Portion entfernen','Видалити порцію'))} ${i+1}">×</button>`:'＋'}</div>`}).join('')}</div>${foodButtons('plan')}${state.plan.length===5?`<div class="feedback">${t(new Set(state.plan).size>=3?L('Fünf Portionen und mehrere Sorten – gut kombiniert! Verteile sie über den Tag.','П’ять порцій і різні види — добре поєднано! Розподіли їх на день.'):L('Fünf Portionen sind geplant. Probiere noch mehr verschiedene Sorten aus.','П’ять порцій заплановано. Спробуй додати більше різних видів.'))}</div>`:''}</div>${next(3)}</section>

<section id="s6">${head(6,L('Das habe ich herausgefunden','Ось що я дізнався / дізналася'),L('Nutze deine Merksätze für das Arbeitsblatt. Fehlende Aufgaben kannst du jederzeit nachholen.','Використай важливі думки для робочого аркуша. Пропущені завдання можна виконати будь-коли.'))}<p class="pill" id="count"></p><div class="memorygrid" id="cards"></div><div class="panel"><h3>${t(L('Meine Lieblingssorten','Мої улюблені види'))}</h3><p>${state.favorites.map(id=>{const f=foods.find(f=>f.id===id);return f?f.icon+' '+t(f.name):''}).join(' · ')||t(L('Noch keine ausgewählt.','Ще не обрано.'))}</p></div><div class="row noprint"><button id="print">${t(L('Übersicht drucken','Надрукувати підсумок'))}</button><button id="reset">${t(L('Neu starten','Почати заново'))}</button><button id="stop">${t(L('Vorlesen stoppen','Зупинити озвучування'))}</button></div></section>
<footer><details><summary>${t(L('Quellen: Deutsche Gesellschaft für Ernährung (DGE)','Джерела: Німецьке товариство харчування (DGE)'))}</summary><p>${t(L('Die Inhalte wurden für den Unterricht vereinfacht. Die Animationen sind Modelle, keine medizinischen Vorhersagen. Die allgemeinen DGE-Empfehlungen richten sich an gesunde Erwachsene; hier nutzen wir fünf Portionen und das eigene Handmaß als alltagstaugliche Orientierung, ohne feste Grammvorgaben.','Матеріали спрощено для уроку. Анімації — моделі, а не медичні прогнози. Загальні рекомендації DGE адресовані здоровим дорослим. Тут ми використовуємо п’ять порцій і власну руку як щоденний орієнтир без точної ваги в грамах.'))}</p><ul>${[
['https://www.dge.de/gesunde-ernaehrung/gut-essen-und-trinken/obst-und-gemuese/',L('Obst und Gemüse – viel und bunt','Овочі та фрукти — багато й різноманітно')],
['https://www.dge.de/gesunde-ernaehrung/gut-essen-und-trinken/dge-ernaehrungskreis/obst-und-gemuese/',L('Ernährungskreis: Obst und Gemüse','Коло харчування: овочі та фрукти')],
['https://www.dge.de/gesunde-ernaehrung/faq/ausgewaehlte-fragen-und-antworten-zu-ballaststoffen/',L('Ballaststoffe','Клітковина')],
['https://www.dge.de/gesunde-ernaehrung/faq/vitamin-c/',L('Vitamin C','Вітамін C')],
['https://www.dge.de/gesunde-ernaehrung/faq/kalium/',L('Kalium','Калій')]
].map(([url,label])=>`<li><a href="${url}" target="_blank" rel="noopener">DGE: ${t(label)}</a></li>`).join('')}</ul><p>${t(L('Stand: September 2026. Keine Anmeldung und keine Werbung. Fortschritt wird nur in diesem Browser gespeichert, soweit möglich. Vorlesen nutzt die deutsche Stimme des Geräts; der Sprachdienst kann je nach Gerät Internet benötigen. Das Lebensmittelbild wurde mit KI erstellt.','Станом на вересень 2026 року. Без реєстрації та реклами. Прогрес за можливості зберігається лише в цьому браузері. Озвучування використовує німецький голос пристрою; службі може бути потрібен інтернет. Зображення продуктів створено за допомогою ШІ.'))}</p></details></footer>`;summary()}
function refreshGame(){document.querySelector('#game').innerHTML=game()}function answer(id,i,reveal=false){const q=questions.find(q=>q.id===id);if(!q||done(id))return;const a=state.answers[id]||{tries:0};if(reveal){if(a.tries<2)return;a.done=true;a.correct=false}else{if(!Number.isInteger(i)||i<0||i>=q.a.length)return;a.tries++;a.choice=i;if(i===q.c){a.done=true;a.correct=true}}state.answers[id]=a;save();document.querySelector('#q-'+id).outerHTML=quiz(id);summary()}
function rerender(){const y=scrollY;render();window.scrollTo({top:y,behavior:'instant'})}function toggle(a,v){const i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1)}function simulate(){if(!state.fed.length){toast(t(L('Wähle zuerst etwas für Alex aus.','Спочатку обери щось для Алекса.')));return}clearInterval(timer);let n=0;const b=document.querySelector('#simulate');b.disabled=true;const steps=[L('📅 Tage vergehen …','📅 Минають дні…'),L('📅 Wochen vergehen …','📅 Минають тижні…'),L('📅 Wir betrachten einen längeren Zeitraum.','📅 Ми розглядаємо тривалий час.')];document.querySelector('#calendar').textContent=t(steps[0]);timer=setInterval(()=>{n++;if(n<3){document.querySelector('#calendar').textContent=t(steps[n])}else{clearInterval(timer);timer=null;state.simulated=true;state.seen.push(state.body+':'+state.mode);save();refreshGame()}},700)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say!==undefined){speak(b.dataset.say);return}if(b.id==='de'||b.id==='uk'){clearInterval(timer);timer=null;window.speechSynthesis?.cancel();state.lang=b.id;save();rerender();return}if(b.dataset.q){answer(b.dataset.q,Number(b.dataset.answer));return}if(b.dataset.solution){answer(b.dataset.solution,0,true);return}if(b.dataset.favorite){toggle(state.favorites,b.dataset.favorite)}else if(b.dataset.plan){if(state.plan.length>=5){toast(t(L('Deine fünf Felder sind voll. Entferne eine Portion, um sie auszutauschen.','П’ять полів заповнено. Видали порцію, щоб замінити її.')));return}state.plan.push(b.dataset.plan)}else if(b.dataset.remove!==undefined){state.plan.splice(Number(b.dataset.remove),1)}else if(b.dataset.explore){state.food=b.dataset.explore;if(!state.explored.includes(state.food))state.explored.push(state.food)}else if(b.dataset.feed){const id=b.dataset.feed;if(state.fed.includes(id)){toast(t(L('Diese Sorte kennt Alex schon. Probiere eine andere.','Алекс уже знає цей вид. Спробуй інший.')));return}if(state.fed.length>=5){toast(t(L('Fünf Sorten entdeckt! Starte jetzt den Zeitvergleich.','П’ять видів досліджено! Запусти порівняння в часі.')));return}clearInterval(timer);timer=null;state.fed.push(id);save();refreshGame();const span=document.createElement('span');span.className='fly';span.setAttribute('aria-hidden','true');span.textContent=foods.find(f=>f.id===id).icon;document.querySelector('#person').append(span);setTimeout(()=>span.remove(),900);return}else if(b.id==='simulate'){simulate();return}else if(b.dataset.body){clearInterval(timer);timer=null;state.body=b.dataset.body;save();refreshGame();return}else if(b.dataset.mode){state.mode=b.dataset.mode;save();refreshGame();return}else if(b.id==='clearfeed'){clearInterval(timer);timer=null;state.fed=[];state.simulated=false;save();refreshGame();return}else if(b.id==='print'){window.print();return}else if(b.id==='stop'){window.speechSynthesis?.cancel();return}else if(b.id==='reset'){if(!confirm(t(L('Alle Antworten und Auswahlen löschen und neu starten?','Видалити всі відповіді й вибори та почати заново?'))))return;clearInterval(timer);window.speechSynthesis?.cancel();const lang=state.lang;state=fresh();state.lang=lang;save();render();window.scrollTo(0,0);return}else return;save();rerender()});render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_learning_progress',description:'Read local fruit and vegetable learning progress without changing it.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({language:state.lang,completed:questions.filter(q=>done(q.id)).map(q=>q.id),fedFoods:state.fed,plannedPortions:state.plan.length})})).catch(()=>{})}catch{}}
</script></body></html>
